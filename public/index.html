<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Task App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>DevOps Task App</h1>

        <p class="subtitle">
            Terraform + Ansible + Docker
        </p>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a task..."
                required
            >

            <button type="submit">
                Add Task
            </button>
        </form>

        <ul id="task-list"></ul>

    </main>

    <script src="app.js"></script>

</body>
</html>
